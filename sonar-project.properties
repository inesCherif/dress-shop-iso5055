# SonarQube analysis settings (read by sonar-scanner from the project root)
sonar.projectKey=dress-shop
sonar.projectName=dress-shop
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
# node_modules is needed for type information but must not be analysed; build/ is compiled output
sonar.exclusions=node_modules/**,build/**
